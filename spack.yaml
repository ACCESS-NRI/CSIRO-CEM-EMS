# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # definitions:
    - _name: csiro-cem-ems
    - _version: 2026.11.001
    - _spack-version: ["1.1"]
    - _provenance: [ coastri_ems, ems ]
    # - _injection: []
  specs:
    # The root Spack Bundle Recipe (SBR) for the model
    - coastri_ems
  packages:
    ems:
      require:
      - '@1.5.3'
    netcdf-c:
      require:
      - '@4.9.3'
      - build_system=cmake build_type=RelWithDebInfo
    # Compilers
    c:
      require:
      - intel-oneapi-compilers@2025.2.0
    cxx:
      require:
      - intel-oneapi-compilers@2025.2.0
    fortran:
      require:
      - intel-oneapi-compilers@2025.2.0
    all:
      prefer:
      - target=x86_64_v4
  view: true
  concretizer:
    unify: true
  repos:
    access_spack_packages:
      git: https://github.com/ACCESS-NRI/access-spack-packages.git
      # TODO: Specify the access-spack-packages version to clone. Provide one of tag:, branch: or commit:.
      tag: aidanheerdegen/issue527
      destination: $env/package-repos/access-spack-packages